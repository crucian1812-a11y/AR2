name: Build Unity APK

on:
  push:
    branches:
      - claude/super-bear-adventure-clone-twher0
      - main
    paths:
      - "unity/**"
      - ".github/workflows/build-unity-apk.yml"
  workflow_dispatch:

env:
  UNITY_VERSION: "2022.3.76f1"

jobs:
  check-credentials:
    name: Проверка доступа к Unity
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_USERNAME: ${{ secrets.UNITY_USERNAME }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$HAS_USERNAME" ] && missing="$missing UNITY_USERNAME"
          [ -z "$HAS_PASSWORD" ] && missing="$missing UNITY_PASSWORD"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Данные для активации Unity найдены — собираем APK."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Не заданы секреты:$missing — сборка APK пропущена."
            echo ""
            echo "==============================================================="
            echo " Чтобы собрать APK, добавьте два секрета:"
            echo "   Settings -> Secrets and variables -> Actions ->"
            echo "   New repository secret"
            echo ""
            echo "   UNITY_USERNAME — почта аккаунта Unity"
            echo "   UNITY_PASSWORD — пароль от него"
            echo ""
            echo " Серийный номер НЕ нужен: у бесплатной лицензии Unity"
            echo " Personal его не существует."
            echo ""
            echo " Инструкция: unity/LICENSE_SETUP.md"
            echo "==============================================================="
          fi

  build:
    name: Сборка APK
    needs: check-credentials
    if: needs.check-credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Ставит Unity Hub, редактор и модуль Android (SDK/NDK/JDK внутри).
      - name: Установить Unity
        uses: RageAgainstThePixel/unity-setup@v2
        with:
          unity-version: ${{ env.UNITY_VERSION }}
          build-targets: Android
          cache-installation: true

      # Активация бесплатной Personal-лицензии: только почта и пароль,
      # серийный номер не требуется. Лицензия освобождается после сборки.
      - name: Активировать лицензию Unity
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Кэш Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Собрать APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$UNITY_EDITOR_PATH" \
            -quit -batchmode -nographics \
            -projectPath "$GITHUB_WORKSPACE/unity" \
            -executeMethod BuildScript.BuildAndroid \
            -outputPath "$GITHUB_WORKSPACE/build/BearAdventure.apk" \
            -logFile - | tail -n 400

      - name: Найти собранный APK
        id: findapk
        run: |
          set -e
          APK=$(find build -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::APK не найден"
            find build -type f | head -50 || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: BearAdventure-Unity-APK
          path: ${{ steps.findapk.outputs.apk }}

      - name: Опубликовать APK в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-unity
          name: "Медвежьи Приключения (Unity) — последний APK"
          prerelease: true
          make_latest: false
          body: |
            Автоматическая сборка Unity-версии игры «Медвежьи Приключения».

            **Как установить:**
            1. Скачайте `BearAdventure.apk` ниже на телефон.
            2. Откройте файл и разрешите установку из неизвестных источников.

            Требуется 64-битный Android (arm64), версия 7.0 и новее.

            **Мультиплеер:** все игроки подключаются к одному Wi-Fi.
            Один нажимает «Создать игру», остальные — «Присоединиться»
            (игра находится автоматически, либо введите IP хоста).
          files: ${{ steps.findapk.outputs.apk }}
