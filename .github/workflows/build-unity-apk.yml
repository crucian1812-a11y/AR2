name: Build Unity APK

on:
  push:
    branches:
      - claude/super-bear-adventure-clone-twher0
      - main
    paths:
      - "unity/**"
      - ".github/workflows/build-unity-apk.yml"
  workflow_dispatch:

env:
  UNITY_VERSION: "2022.3.76f1"

jobs:
  check-credentials:
    name: Проверка доступа к Unity
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          missing=""
          [ -z "$HAS_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$HAS_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          [ -z "$HAS_SERIAL" ] && missing="$missing UNITY_SERIAL"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Данные для активации Unity найдены — собираем APK."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Не заданы секреты:$missing — сборка APK пропущена."
            echo ""
            echo "==============================================================="
            echo " Чтобы собрать APK, нужно один раз добавить три секрета."
            echo " Полная инструкция: unity/LICENSE_SETUP.md"
            echo ""
            echo " Settings -> Secrets and variables -> Actions ->"
            echo " New repository secret:"
            echo "   UNITY_EMAIL    — почта аккаунта Unity"
            echo "   UNITY_PASSWORD — пароль от него"
            echo "   UNITY_SERIAL   — серийный номер лицензии из id.unity.com"
            echo ""
            echo " Рекомендуется завести ОТДЕЛЬНЫЙ аккаунт Unity только для"
            echo " сборки — репозиторий публичный, и так безопаснее."
            echo "==============================================================="
          fi

  build:
    name: Сборка APK
    needs: check-credentials
    if: needs.check-credentials.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Образ Unity с Android-модулем занимает десятки гигабайт,
      # поэтому освобождаем место на раннере.
      - name: Освободить место на диске
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Кэш Library
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Собрать APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          buildName: BearAdventure
          androidExportType: androidPackage
          # Скрипт сборки создаёт сцену на лету, поэтому рабочее дерево
          # становится "грязным" — это ожидаемо.
          allowDirtyBuild: true

      - name: Найти собранный APK
        id: findapk
        run: |
          set -e
          APK=$(find build -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::APK не найден"
            find build -type f | head -50 || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: BearAdventure-Unity-APK
          path: ${{ steps.findapk.outputs.apk }}

      - name: Опубликовать APK в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-unity
          name: "Медвежьи Приключения (Unity) — последний APK"
          prerelease: true
          make_latest: false
          body: |
            Автоматическая сборка Unity-версии игры «Медвежьи Приключения».

            **Как установить:**
            1. Скачайте `BearAdventure.apk` ниже на телефон.
            2. Откройте файл и разрешите установку из неизвестных источников.

            Требуется 64-битный Android (arm64), версия 7.0 и новее.

            **Мультиплеер:** все игроки подключаются к одному Wi-Fi.
            Один нажимает «Создать игру», остальные — «Присоединиться»
            (игра находится автоматически, либо введите IP хоста).
          files: ${{ steps.findapk.outputs.apk }}
